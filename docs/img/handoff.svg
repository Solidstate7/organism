<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 844" width="720" height="844" role="img" aria-label="The eight steps of /handoff in four jobs. Settle the code: read the repo, commit the work first. Record the reasons: find the decisions, write the records, show the draft, commit the records after an optional scan for confidential terms. Link records to commits. Hand over: rewrite the brief. Each step carries the problem it prevents.">
  <style>
    :root{--bg:#F3F5F7;--surface:#FFFFFF;--ink:#1B222B;--muted:#5B6773;--line:#C3CCD5;--ok:#1F8A5B;--ok-soft:#E3F3EA;--warn:#B26A12;--warn-soft:#FBEEDB;--opt:#7A6400;--opt-soft:#FFF1A8}
    @media (prefers-color-scheme:dark){:root{--bg:#14181D;--surface:#1C2229;--ink:#E6EAEE;--muted:#9AA6B2;--line:#3A4551;--ok:#4CC38A;--ok-soft:#173225;--warn:#E0A24A;--warn-soft:#3A2B13;--opt:#EDD15A;--opt-soft:#36330F}}
    text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .bg{fill:var(--bg)}
    .box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
    .box.git{fill:var(--bg);stroke-dasharray:5 4}
    .box.hot{stroke:var(--ok);stroke-width:2}
    .t{fill:var(--ink);font-size:13px;font-weight:600}
    .w{fill:var(--ink);font-size:12px}
    .edge{stroke:var(--ink);stroke-width:1.2;fill:none}
    #arr path{fill:var(--ink)}
    .lbl{fill:var(--muted);font-size:11px}
    .rail{stroke:var(--line);stroke-width:1.2;fill:none}
    .rail-t{fill:var(--muted);font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
    .pill{fill:var(--bg);stroke:var(--line);stroke-width:1}
    .pill.warn{fill:var(--warn-soft);stroke:none}
    .pill.ok{fill:var(--ok-soft);stroke:none}
    .pill-t{fill:var(--muted);font-size:10.5px;font-weight:600}
    .pill-t.warn{fill:var(--warn)}
    .pill-t.ok{fill:var(--ok)}
    .hl.opt{fill:var(--opt-soft)}
    .w.opt{fill:var(--opt)}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="720" height="844" rx="6"/>

  <!-- job rail -->
  <path class="rail" d="M152,24 H146 V196 H152"/>
  <text class="rail-t" x="134" y="106" text-anchor="end">SETTLE</text>
  <text class="rail-t" x="134" y="120" text-anchor="end">THE CODE</text>

  <path class="rail" d="M152,232 H146 V604 H152"/>
  <text class="rail-t" x="134" y="414" text-anchor="end">RECORD</text>
  <text class="rail-t" x="134" y="428" text-anchor="end">THE REASONS</text>

  <path class="rail" d="M152,640 H146 V712 H152"/>
  <text class="rail-t" x="134" y="672" text-anchor="end">LINK</text>
  <text class="rail-t" x="134" y="686" text-anchor="end">THE TWO</text>

  <path class="rail" d="M152,748 H146 V820 H152"/>
  <text class="rail-t" x="134" y="780" text-anchor="end">HAND</text>
  <text class="rail-t" x="134" y="794" text-anchor="end">OVER</text>

  <!-- bypass: no decision, skip to 8 -->
  <path class="edge" d="M600,268 H630 V784 H602" marker-end="url(#arr)"/>
  <text class="lbl" x="638" y="300">no decision:</text>
  <text class="lbl" x="638" y="314">skip to 8</text>

  <!-- 1 -->
  <rect class="box" x="160" y="24" width="440" height="72" rx="4"/>
  <text class="t" x="176" y="48">1 · Read the repo</text>
  <rect class="pill warn" x="408" y="34" width="176" height="18" rx="9"/>
  <text class="pill-t warn" x="574" y="47" text-anchor="end" textLength="156" lengthAdjust="spacingAndGlyphs">asks once: rebuild old history?</text>
  <text class="w" x="176" y="68">Uses the repo's own records layout; never imposes one.</text>
  <text class="w" x="176" y="84">Notes uncommitted work and history that no record covers.</text>

  <path class="edge" d="M380,96 V122" marker-end="url(#arr)"/>

  <!-- 2 -->
  <rect class="box git" x="160" y="124" width="440" height="72" rx="4"/>
  <text class="t" x="176" y="148">2 · Commit the work first</text>
  <rect class="pill warn" x="405" y="134" width="179" height="18" rx="9"/>
  <text class="pill-t warn" x="574" y="147" text-anchor="end" textLength="159" lengthAdjust="spacingAndGlyphs">asks: gitignore generated data?</text>
  <text class="w" x="176" y="168">Code lands first, so the record can point back at it.</text>
  <text class="w" x="176" y="184">Generated data gets gitignored. A secret stops the run.</text>

  <path class="edge" d="M380,196 V230" marker-end="url(#arr)"/>

  <!-- 3 -->
  <rect class="box" x="160" y="232" width="440" height="72" rx="4"/>
  <text class="t" x="176" y="256">3 · Find the decisions</text>
  <text class="w" x="176" y="276">Read now, while the session still holds the reasons.</text>
  <text class="w" x="176" y="292">A decision about another project is named, not recorded.</text>

  <path class="edge" d="M380,304 V330" marker-end="url(#arr)"/>

  <!-- 4 -->
  <rect class="box" x="160" y="332" width="440" height="72" rx="4"/>
  <text class="t" x="176" y="356">4 · Write the records</text>
  <text class="w" x="176" y="376">Full why on file; one line of it loads every session.</text>
  <text class="w" x="176" y="392">Situations only. No account numbers, names or addresses.</text>

  <path class="edge" d="M380,404 V430" marker-end="url(#arr)"/>

  <!-- 5 -->
  <rect class="box hot" x="160" y="432" width="440" height="72" rx="4"/>
  <text class="t" x="176" y="456">5 · Show the draft</text>
  <rect class="pill ok" x="493" y="442" width="91" height="18" rx="9"/>
  <text class="pill-t ok" x="574" y="455" text-anchor="end" textLength="71" lengthAdjust="spacingAndGlyphs">Auto approval</text>
  <text class="w" x="176" y="476">You read what is about to become durable.</text>
  <text class="w" x="176" y="492">No second yes. A wrong record is edited or superseded later.</text>

  <path class="edge" d="M380,504 V530" marker-end="url(#arr)"/>

  <!-- 6 -->
  <rect class="box git" x="160" y="532" width="440" height="72" rx="4"/>
  <text class="t" x="176" y="556">6 · Commit the records</text>
  <rect class="pill" x="406" y="542" width="178" height="18" rx="9"/>
  <text class="pill-t" x="574" y="555" text-anchor="end" textLength="158" lengthAdjust="spacingAndGlyphs">never pushes unless instructed</text>
  <text class="w" x="176" y="576">Just the records and the index, after the code.</text>
  <rect class="hl opt" x="170" y="579" width="324" height="18" rx="4"/>
  <text class="w opt" x="176" y="592" textLength="312" lengthAdjust="spacingAndGlyphs">Scanned for confidential terms first (optional); a hit stops it.</text>

  <path class="edge" d="M380,604 V638" marker-end="url(#arr)"/>

  <!-- 7 -->
  <rect class="box git" x="160" y="640" width="440" height="72" rx="4"/>
  <text class="t" x="176" y="664">7 · Link records to commits</text>
  <text class="w" x="176" y="684">A commit can answer why it exists.</text>
  <text class="w" x="176" y="700">A record can answer what it became.</text>

  <path class="edge" d="M380,712 V746" marker-end="url(#arr)"/>

  <!-- 8 -->
  <rect class="box" x="160" y="748" width="440" height="72" rx="4"/>
  <text class="t" x="176" y="772">8 · Rewrite the brief</text>
  <text class="w" x="176" y="792">The next session starts warm, from a note you can edit.</text>
  <text class="w" x="176" y="808">Nothing else writes it; a skipped run leaves it as it was.</text>
</svg>
