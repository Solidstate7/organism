<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" role="img" aria-label="One main session sends orders to three agents and gets reports back. Each agent is one repo with one session at a time. Stopping an agent runs /harvest, which rewrites the brief in its repo, and the agent's next session starts from that brief. A log records every start, stop, order and report.">
  <style>
    :root{--bg:#F3F5F7;--surface:#FFFFFF;--ink:#1B222B;--muted:#5B6773;--line:#C3CCD5;--ok:#1F8A5B;--warn:#B26A12;--accent:#2B5F9E;--opt:#7A6400;--opt-soft:#FFF1A8}
    @media (prefers-color-scheme:dark){:root{--bg:#14181D;--surface:#1C2229;--ink:#E6EAEE;--muted:#9AA6B2;--line:#3A4551;--ok:#4CC38A;--warn:#E0A24A;--accent:#7FB0E8;--opt:#EDD15A;--opt-soft:#36330F}}
    text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .bg{fill:var(--bg)}
    .box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
    .hot{stroke:var(--accent);stroke-width:2}
    .t{fill:var(--ink);font-size:13px;font-weight:600}
    .s{fill:var(--muted);font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .lbl{fill:var(--muted);font-size:11px}
    .edge{stroke:var(--ink);stroke-width:1.2;fill:none}
    #arr path{fill:var(--ink)}
    .box.opt{fill:var(--bg);stroke-dasharray:5 4}
    .edge.opt{stroke-dasharray:4 3}
    .pill.opt{fill:var(--opt-soft)}
    .pill-t.opt{fill:var(--opt);font-size:10.5px;font-weight:600}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="840" height="520" rx="6"/>

  <!-- row 1: the main session -->
  <rect class="box hot" x="315" y="40" width="210" height="76" rx="4"/>
  <text class="t" x="331" y="63">Main session</text>
  <text class="s" x="331" y="82">you give the orders here</text>
  <text class="s" x="331" y="96">and read the reports</text>

  <!-- main session <-> agents -->
  <path class="edge" d="M313,76 H125 V188" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="lbl" x="220" y="70" text-anchor="middle">orders and reports</text>
  <path class="edge" d="M420,118 V188" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <path class="edge" d="M527,76 H715 V188" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="lbl" x="620" y="70" text-anchor="middle">sent with SendMessage</text>

  <!-- agent web and its brief -->
  <rect class="box" x="20" y="190" width="210" height="76" rx="4"/>
  <text class="t" x="36" y="211">Agent: web</text>
  <text class="s" x="36" y="228">~/dev/example-web</text>
  <text class="s" x="36" y="242">one repo, one session</text>
  <text class="s" x="36" y="256">at a time</text>
  <path class="edge" d="M105,266 V338" marker-end="url(#arr)"/>
  <path class="edge" d="M145,340 V268" marker-end="url(#arr)"/>
  <rect class="box" x="20" y="340" width="210" height="76" rx="4"/>
  <text class="t" x="36" y="361">Brief</text>
  <text class="s" x="36" y="378">HANDOFF.md in the repo</text>
  <text class="s" x="36" y="392">where the work stands</text>

  <!-- agent api and its brief -->
  <rect class="box" x="315" y="190" width="210" height="76" rx="4"/>
  <text class="t" x="331" y="211">Agent: api</text>
  <text class="s" x="331" y="228">~/dev/example-api</text>
  <text class="s" x="331" y="242">one repo, one session</text>
  <text class="s" x="331" y="256">at a time</text>
  <path class="edge" d="M400,266 V338" marker-end="url(#arr)"/>
  <path class="edge" d="M440,340 V268" marker-end="url(#arr)"/>
  <rect class="box" x="315" y="340" width="210" height="76" rx="4"/>
  <text class="t" x="331" y="361">Brief</text>
  <text class="s" x="331" y="378">HANDOFF.md in the repo</text>
  <text class="s" x="331" y="392">where the work stands</text>

  <!-- agent notes and its brief -->
  <rect class="box" x="610" y="190" width="210" height="76" rx="4"/>
  <text class="t" x="626" y="211">Agent: notes</text>
  <text class="s" x="626" y="228">~/dev/example-notes</text>
  <text class="s" x="626" y="242">one repo, one session</text>
  <text class="s" x="626" y="256">at a time</text>
  <path class="edge" d="M695,266 V338" marker-end="url(#arr)"/>
  <path class="edge" d="M735,340 V268" marker-end="url(#arr)"/>
  <rect class="box" x="610" y="340" width="210" height="76" rx="4"/>
  <text class="t" x="626" y="361">Brief</text>
  <text class="s" x="626" y="378">HANDOFF.md in the repo</text>
  <text class="s" x="626" y="392">where the work stands</text>

  <text class="lbl" x="390" y="300" text-anchor="end">fleet down:</text>
  <text class="lbl" x="390" y="314" text-anchor="end">/harvest rewrites it, then /exit</text>
  <text class="lbl" x="450" y="300">fleet up:</text>
  <text class="lbl" x="450" y="314">a new session starts from it</text>

  <!-- the log -->
  <rect class="box" x="20" y="444" width="800" height="56" rx="4"/>
  <text class="t" x="36" y="466">Log</text>
  <text class="s" x="36" y="484">hooks add a line for every start, stop, order and report, also for sessions you start by hand</text>
</svg>
